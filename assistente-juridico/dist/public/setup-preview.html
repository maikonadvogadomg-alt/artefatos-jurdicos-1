<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Setup Preview</title>
<style>*{box-sizing:border-box;margin:0;padding:0}</style>
</head>
<body style="min-height:100vh;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;font-family:system-ui,sans-serif;color:#f1f5f9;">
<div style="max-width:420px;width:100%">
  <div style="text-align:center;margin-bottom:2rem">
    <div style="font-size:3rem;margin-bottom:0.75rem">⚖️</div>
    <h1 style="font-size:1.5rem;font-weight:800;margin:0;color:#f1f5f9">SK Jurídico IA</h1>
    <p style="color:#94a3b8;margin-top:0.5rem;font-size:0.9rem">v1.8 — Configure o servidor ou abra direto</p>
    <p style="color:#64748b;margin-top:0.25rem;font-size:0.8rem">O app abre sempre. Configure o servidor para usar IA e consultas.</p>
  </div>

  <!-- Abrir sem servidor -->
  <button style="width:100%;background:#1e3a8a;border:2px solid #3b82f6;border-radius:0.75rem;padding:1rem 1.25rem;cursor:pointer;color:#f1f5f9;text-align:left;margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:0.75rem">
    <span style="font-size:1.25rem;margin-top:0.1rem">📵</span>
    <div>
      <div style="font-weight:700;font-size:1rem;color:#60a5fa">Abrir sem servidor agora</div>
      <div style="color:#93c5fd;font-size:0.8rem;margin-top:0.25rem">Use o app normalmente — configure o servidor depois em Configurações → Servidor</div>
    </div>
  </button>

  <p style="color:#475569;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;text-align:center;margin-bottom:1rem">
    OU CONFIGURE O SERVIDOR AGORA (PARA IA E CONSULTAS)
  </p>

  <div style="background:#1e293b;border-radius:1rem;padding:1.25rem;margin-bottom:1rem">
    <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.25rem">

      <button style="display:flex;align-items:center;gap:0.75rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;padding:0.75rem 1rem;cursor:pointer;color:#cbd5e1;text-align:left">
        <span style="font-size:1.1rem">🖥️</span>
        <div>
          <div style="font-weight:600;font-size:0.875rem">PC na rede Wi-Fi</div>
          <div style="color:#64748b;font-size:0.75rem">Troque pelo IP do seu PC (Win: ipconfig)</div>
        </div>
      </button>

      <button style="display:flex;align-items:center;gap:0.75rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;padding:0.75rem 1rem;cursor:pointer;color:#cbd5e1;text-align:left">
        <span style="font-size:1.1rem">📶</span>
        <div>
          <div style="font-weight:600;font-size:0.875rem">Emulador Android</div>
          <div style="color:#64748b;font-size:0.75rem">Apenas em emuladores no PC</div>
        </div>
      </button>

      <button style="display:flex;align-items:center;gap:0.75rem;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;padding:0.75rem 1rem;cursor:pointer;color:#cbd5e1;text-align:left">
        <span style="font-size:1.1rem">🌐</span>
        <div>
          <div style="font-weight:600;font-size:0.875rem">Servidor na internet / VPS</div>
          <div style="color:#64748b;font-size:0.75rem">URL do seu servidor publicado</div>
        </div>
      </button>
    </div>

    <input placeholder="http://192.168.1.X:8080" style="width:100%;background:#0f172a;border:1px solid #334155;border-radius:0.5rem;padding:0.75rem 1rem;color:#f1f5f9;font-size:1rem;outline:none"/>
  </div>

  <button disabled style="width:100%;background:#1e293b;color:#475569;border:none;border-radius:0.75rem;padding:1rem;font-size:1rem;font-weight:700;cursor:not-allowed;display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:1.5rem">
    Conectar ao servidor →
  </button>

  <p style="text-align:center;color:#334155;font-size:0.72rem">
    SK Jurídico IA v1.8 — 100% local, sem vínculo com terceiros
  </p>
</div>
</body>
</html>
